name: Bootstrap Terraform state

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_STATE_REGION: ${{ vars.AWS_STATE_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  bootstrap:
    name: Bootstrap S3 backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: awscli jq

      - name: Validate repository variables
        env:
          AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
          AWS_STATE_ACCOUNT_ID: ${{ vars.AWS_STATE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$AWS_OIDC_ROLE_ARN"
          test "$AWS_STATE_ACCOUNT_ID" = "134584031874"
          test -n "$AWS_STATE_REGION"
          test -n "$TF_STATE_BUCKET"

      - name: Report OIDC claims
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString(),
            );
            core.info(JSON.stringify({
              aud: claims.aud,
              ref: claims.ref,
              repository: claims.repository,
              sub: claims.sub,
              workflow_ref: claims.workflow_ref,
            }));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_STATE_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Create and secure state bucket
        env:
          AWS_STATE_ACCOUNT_ID: ${{ vars.AWS_STATE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            if [[ "$AWS_STATE_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --object-ownership BucketOwnerEnforced
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --create-bucket-configuration "LocationConstraint=$AWS_STATE_REGION" \
                --object-ownership BucketOwnerEnforced
            fi
          fi

          current_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$current_account" = "$AWS_STATE_ACCOUNT_ID"

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          bucket_policy="$(jq -cn --arg bucket "$TF_STATE_BUCKET" '{
            Version: "2012-10-17",
            Statement: [{
              Sid: "DenyInsecureTransport",
              Effect: "Deny",
              Principal: "*",
              Action: "s3:*",
              Resource: ["arn:aws:s3:::" + $bucket, "arn:aws:s3:::" + $bucket + "/*"],
              Condition: {Bool: {"aws:SecureTransport": "false"}}
            }]
          }')"
          aws s3api put-bucket-policy --bucket "$TF_STATE_BUCKET" --policy "$bucket_policy"
